<!DOCTYPE html>
<html lang="fr">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

:root {
  --bg: #171512;
  --surface: #221F1B;
  --surface-2: #2A2620;
  --border: #3A342C;
  --text: #F2EBDD;
  --text-dim: #B0A696;
  --brass: #C6902E;
  --brass-dim: #8F6A22;
  --brick: #C0564A;
  --brick-bg: #3A2320;
  --sage: #8FB08F;
  --font-display: 'Fraunces', serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
}

.app-shell {
  display: flex;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
}

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--brass);
  color: #241B0B;
  font-family: var(--font-display);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.brand-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: 0.02em;
}

.nav { display: flex; flex-direction: column; gap: 4px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
}

.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--brass); color: #241B0B; }
.lock-badge { margin-left: auto; display: flex; opacity: 0.6; }

.content {
  flex: 1;
  padding: 28px 32px;
  overflow-y: auto;
}

.page-title {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 600;
  margin: 0;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

.topbar-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text-dim);
}

.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  width: 180px;
}

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }

.chip {
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

.chip.active { background: var(--brass); border-color: var(--brass); color: #241B0B; }

.caisse-layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}

.product-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: flex-start;
  cursor: pointer;
  text-align: left;
}

.product-card:hover { border-color: var(--brass); }
.product-card.disabled { opacity: 0.45; cursor: not-allowed; }

.product-name { font-weight: 600; font-size: 14px; }
.product-price { font-family: var(--font-mono); color: var(--brass); font-size: 13px; }

.product-flag {
  position: absolute;
  top: 8px;
  right: 8px;
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 999px;
  text-transform: uppercase;
}

.flag-out { background: var(--brick-bg); color: var(--brick); }
.flag-low { background: #3A2E12; color: var(--brass); }

.caisse-right {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: sticky;
  top: 0;
}

.panel-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 17px; margin: 0; }

.cart-list { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow-y: auto; }

.cart-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.cart-item-info { display: flex; flex-direction: column; }
.cart-item-name { font-size: 13px; font-weight: 500; }
.cart-item-price { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }
.cart-item-actions { display: flex; align-items: center; gap: 4px; }

.qty-btn {
  width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.qty-btn.remove { color: var(--brick); }
.qty-value { width: 20px; text-align: center; font-family: var(--font-mono); font-size: 13px; }

.cart-footer { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--border); padding-top: 14px; }

.field-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.field-group label { font-size: 12px; color: var(--text-dim); font-weight: 500; }
.field-row { display: flex; gap: 12px; }

select, input[type="text"], input[type="number"], input[type="password"], input[type="email"] {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 10px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  outline: none;
  width: 100%;
}
select:focus, input:focus { border-color: var(--brass); }

.payment-row { display: flex; gap: 8px; }
.payment-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-dim); font-size: 11px; cursor: pointer;
}
.payment-btn.active { border-color: var(--brass); color: var(--brass); background: #2E2716; }

.cart-total-row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-display); }
.cart-total-value { font-size: 22px; color: var(--brass); font-family: var(--font-mono); }

.form-error { color: var(--brick); font-size: 12px; margin: 0; }
.form-success { color: var(--sage); font-size: 12px; margin: 6px 0 0; }

.btn-primary {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--brass); color: #241B0B; border: none; border-radius: 8px;
  padding: 11px 18px; font-family: var(--font-body); font-weight: 600; font-size: 14px; cursor: pointer;
}
.btn-primary:hover { background: #D69F3E; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-block { width: 100%; }

.btn-ghost {
  display: inline-flex; align-items: center; gap: 4px;
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
}
.btn-ghost:hover { color: var(--text); border-color: var(--brass); }
.btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-ghost.danger:hover { color: var(--brick); border-color: var(--brick); }

.btn-danger {
  background: var(--brick); color: #2A0F0C; border: none; border-radius: 6px;
  padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
}

.empty-hint { color: var(--text-dim); font-size: 13px; padding: 20px 0; }

.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th {
  text-align: left; padding: 12px 16px; color: var(--text-dim); font-weight: 500; font-size: 12px;
  border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.03em;
}
.data-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.data-table tr:last-child td { border-bottom: none; }
.row-low-stock { background: rgba(192, 86, 74, 0.08); }
.row-voided { background: rgba(192, 86, 74, 0.06); opacity: 0.65; }
.mono { font-family: var(--font-mono); }
.alert-icon { color: var(--brick); margin-left: 6px; vertical-align: -2px; }

.badge-cat {
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; color: var(--text-dim);
}
.badge-ok { background: #1F3A24; color: var(--sage); border-radius: 999px; padding: 2px 9px; font-size: 11px; }
.badge-voided { background: var(--brick-bg); color: var(--brick); border-radius: 999px; padding: 2px 9px; font-size: 11px; }
.void-reason { font-size: 11px; color: var(--text-dim); font-style: italic; }

.row-actions { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.inline-restock { display: flex; align-items: center; gap: 6px; }
.inline-restock input { width: 90px; padding: 6px 8px; }
.confirm-text { font-size: 12px; color: var(--text-dim); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(10, 9, 7, 0.6);
  display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
}

.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 22px; width: 100%; max-width: 420px;
}

.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.modal-header h3 { font-family: var(--font-display); margin: 0; font-size: 18px; }
.modal-form { display: flex; flex-direction: column; gap: 14px; }
.form-hint { font-size: 12px; color: var(--text-dim); margin: -6px 0 0; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.card-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 15px; margin: 0 0 14px; }

.employee-form { margin-bottom: 20px; display: flex; flex-direction: column; gap: 14px; }
.employee-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.employee-card { display: flex; flex-direction: column; gap: 10px; position: relative; }
.employee-avatar {
  width: 40px; height: 40px; border-radius: 50%; background: var(--brass); color: #241B0B;
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-display);
}
.employee-info { display: flex; flex-direction: column; }
.employee-name { font-weight: 600; font-size: 14px; }
.employee-role { font-size: 12px; color: var(--text-dim); }
.employee-stats { display: flex; gap: 16px; border-top: 1px solid var(--border); padding-top: 10px; flex-wrap: wrap; }
.employee-stats > div { display: flex; flex-direction: column; }
.stat-value { font-family: var(--font-mono); font-weight: 600; font-size: 14px; }
.stat-value.warn { color: var(--brick); }
.stat-label { font-size: 11px; color: var(--text-dim); }
.employee-remove { align-self: flex-start; }

.employee-session { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.employee-session-info { display: flex; align-items: center; gap: 8px; }
.employee-session-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--brass); color: #241B0B; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; font-family: var(--font-display); flex-shrink: 0; }
.employee-session-name { font-size: 13px; font-weight: 600; }
.employee-session-role { font-size: 11px; color: var(--text-dim); }
.employee-choose-list { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
.employee-choose-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; text-align: left; font-family: var(--font-body); font-size: 13px; }
.employee-choose-item:hover { border-color: var(--brass); }
.employee-choose-item small { display: block; color: var(--text-dim); font-size: 11px; font-weight: 400; }

.pin-modal { max-width: 320px; text-align: center; }
.pin-dots { display: flex; justify-content: center; gap: 12px; margin: 18px 0; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); }
.pin-dot.filled { background: var(--brass); border-color: var(--brass); }
.pin-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pin-key { padding: 14px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 16px; font-family: var(--font-mono); cursor: pointer; }
.pin-key:hover { border-color: var(--brass); }

.security-block { margin-bottom: 18px; }
.security-block:last-child { margin-bottom: 0; }
.security-block h4 { margin: 0 0 8px; font-size: 13px; color: var(--text-dim); font-weight: 600; }
.security-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.security-form input, .security-form select { flex: 1; min-width: 130px; }

.stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.stat-card-label { font-size: 12px; color: var(--text-dim); }
.stat-card-value { font-family: var(--font-display); font-size: 24px; color: var(--brass); }

.report-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.span-2 { grid-column: span 2; }

.mini-chart { display: flex; align-items: flex-end; gap: 10px; height: 220px; padding: 0 4px; }
.mini-chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.mini-chart-bar { width: 100%; max-width: 36px; background: var(--brass); border-radius: 4px 4px 0 0; min-height: 2px; }
.mini-chart-label { font-size: 11px; color: var(--text-dim); }

.top-products-list { display: flex; flex-direction: column; gap: 10px; }
.top-product-row { display: flex; align-items: center; gap: 12px; }
.top-product-rank {
  width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); color: var(--text-dim);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: var(--font-mono);
}
.top-product-info { flex: 1; display: flex; flex-direction: column; }
.top-product-name { font-size: 13px; font-weight: 500; }
.top-product-qty { font-size: 11px; color: var(--text-dim); }
.top-product-revenue { font-size: 13px; color: var(--brass); }

.payment-breakdown { display: flex; flex-direction: column; gap: 14px; }
.payment-bar-row { display: grid; grid-template-columns: 110px 1fr 90px; align-items: center; gap: 10px; }
.payment-bar-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
.payment-bar-track { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.payment-bar-fill { height: 100%; background: var(--brass); }
.payment-bar-value { font-size: 12px; text-align: right; }

.receipt {
  width: 300px; background: #F2EBDD; color: #241B0B; border-radius: 4px; padding: 4px 0;
  font-family: var(--font-mono);
}
.receipt-perforation {
  height: 10px;
  background-image: radial-gradient(circle, var(--bg) 3px, transparent 3.5px);
  background-size: 16px 16px;
  background-position: center;
}
.receipt-body { padding: 16px 22px; }
.receipt-head { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 16px; margin-bottom: 8px; }
.receipt-sub { text-align: center; font-size: 11px; margin: 2px 0; color: #5A4E3B; }
.receipt-divider { border-top: 1px dashed #8F6A22; margin: 10px 0; }
.receipt-items { display: flex; flex-direction: column; gap: 6px; }
.receipt-item { display: flex; justify-content: space-between; font-size: 12px; }
.receipt-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 15px; margin: 8px 0; }
.receipt-thanks { text-align: center; font-size: 12px; margin-top: 12px; font-style: italic; }

.receipt-actions { display: flex; gap: 8px; padding: 0 22px 18px; }
.receipt-actions .btn-primary, .receipt-actions .btn-ghost { flex: 1; justify-content: center; }
.receipt-actions .btn-ghost { color: #5A4E3B; border-color: #C9B98A; }

.setup-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
.setup-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 26px; max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.setup-head { display: flex; align-items: center; gap: 10px; }
.setup-head h1 { font-family: var(--font-display); font-size: 20px; margin: 0; color: var(--text); }
.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.setup-note { font-size: 11px; color: var(--text-dim); text-align: center; margin: 0; }

@media print {
  body * { visibility: hidden; }
  .receipt, .receipt * { visibility: visible; }
  .receipt { position: absolute; top: 0; left: 0; width: 300px; box-shadow: none; }
  .receipt-actions, .receipt-perforation { display: none !important; }
}

@media (max-width: 860px) {
  .caisse-layout { grid-template-columns: 1fr; }
  .caisse-right { position: static; }
  .report-grid { grid-template-columns: 1fr; }
  .span-2 { grid-column: span 1; }
}

@media (max-width: 700px) {
  .app-shell { flex-direction: column; }
  .sidebar {
    width: 100%; height: auto; flex-direction: row; align-items: center;
    padding: 10px 14px; order: 2; position: sticky; bottom: 0; z-index: 40;
  }
  .brand { display: none; }
  .nav { flex-direction: row; flex: 1; justify-content: space-around; }
  .nav-item { flex-direction: column; gap: 4px; font-size: 11px; padding: 8px; }
  .nav-label { display: none; }
  .lock-badge { display: none; }
  .content { order: 1; padding: 18px; }
  .product-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .setup-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const CATEGORIES = ['Bières', 'Boissons', 'Cocktails', 'Plats', 'Snacks'];
const ROLES = ['Serveur(se)', 'Barman/Barmaid', 'Cuisinier(ère)', 'Caissier(ère)', 'Gérant(e)'];
const PAYMENT_METHODS = [
  { id: 'especes', label: 'Espèces', icon: 'coins' },
  { id: 'carte', label: 'Carte', icon: 'card' },
  { id: 'mobile', label: 'Mobile Money', icon: 'phone' },
];

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function formatFCFA(n) {
  return new Intl.NumberFormat('fr-FR').format(Math.round(n || 0)) + ' FCFA';
}
function formatDateTime(ts) {
  return new Date(ts).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function formatDay(ts) {
  return new Date(ts).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}
function isSameDay(ts, ref) {
  const a = new Date(ts), b = new Date(ref);
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function initials(name) {
  return (name || '').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
}
function translateFirebaseError(err) {
  const code = err && err.code;
  if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') return 'Email ou mot de passe incorrect.';
  if (code === 'auth/user-not-found') return "Cet utilisateur n'existe pas dans Firebase Authentication.";
  if (code === 'auth/invalid-api-key' || code === 'auth/api-key-not-valid') return 'Clé API invalide. Vérifiez les informations copiées depuis Firebase.';
  if (code === 'auth/network-request-failed') return 'Connexion internet indisponible. Réessayez.';
  if (code === 'auth/too-many-requests') return 'Trop de tentatives. Réessayez dans quelques minutes.';
  return 'Erreur de connexion : ' + (err && err.message ? err.message : 'inconnue.');
}

function PinPad({ title, subtitle, error, expectedLength = 4, onSubmit, onCancel }) {
  const [pin, setPin] = useState('');
  function press(d) { if (pin.length < expectedLength) setPin(pin + d); }
  function backspace() { setPin(pin.slice(0, -1)); }
  function submit() { if (pin.length === expectedLength) { onSubmit(pin); setPin(''); } }
  return (
    <div className="modal-overlay" onClick={onCancel}>
      <div className="modal pin-modal" onClick={e => e.stopPropagation()}>
        <div className="modal-header"><h3>{title}</h3><button className="btn-ghost" onClick={onCancel}><Icon name="x" size={16}/></button></div>
        {subtitle && <p className="form-hint" style={{ marginBottom: 8 }}>{subtitle}</p>}
        <div className="pin-dots">
          {Array.from({ length: expectedLength }).map((_, i) => (
            <span key={i} className={`pin-dot ${i < pin.length ? 'filled' : ''}`}></span>
          ))}
        </div>
        {error && <p className="form-error" style={{ textAlign: 'center' }}>{error}</p>}
        <div className="pin-keypad">
          {['1','2','3','4','5','6','7','8','9'].map(d => (
            <button key={d} type="button" className="pin-key" onClick={() => press(d)}>{d}</button>
          ))}
          <button type="button" className="pin-key" onClick={() => setPin('')}>Effacer</button>
          <button type="button" className="pin-key" onClick={() => press('0')}>0</button>
          <button type="button" className="pin-key" onClick={backspace}>⌫</button>
        </div>
        <button className="btn-primary btn-block" disabled={pin.length !== expectedLength} onClick={submit} style={{ marginTop: 14 }}>Valider</button>
      </div>
    </div>
  );
}

// ==================== RACINE : gère la connexion Firebase ====================
function Root() {
  const [status, setStatus] = useState('loading'); // loading | setup | ready
  const [error, setError] = useState('');

  useEffect(() => {
    let raw = null;
    try { raw = localStorage.getItem(FB_CONFIG_KEY); } catch (e) {}
    if (!raw) { setStatus('setup'); return; }
    let cfg;
    try { cfg = JSON.parse(raw); } catch (e) { setStatus('setup'); return; }
    connect(cfg);
    // eslint-disable-next-line
  }, []);

  function connect(cfg) {
    setStatus('loading');
    setError('');
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp({
          apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId,
          storageBucket: cfg.storageBucket, messagingSenderId: cfg.messagingSenderId, appId: cfg.appId,
        });
      }
      firebase.auth().signInWithEmailAndPassword(cfg.loginEmail, cfg.loginPassword)
        .then(() => {
          try { localStorage.setItem(FB_CONFIG_KEY, JSON.stringify(cfg)); } catch (e) {}
          setStatus('ready');
        })
        .catch(err => { setError(translateFirebaseError(err)); setStatus('setup'); });
    } catch (err) {
      setError('Configuration invalide : ' + err.message);
      setStatus('setup');
    }
  }

  function resetConfig() {
    try { localStorage.removeItem(FB_CONFIG_KEY); } catch (e) {}
    try { firebase.auth().signOut(); } catch (e) {}
    setStatus('setup');
    setError('');
  }

  if (status === 'loading') {
    return <div className="setup-shell"><p style={{ color: 'var(--text-dim)' }}>Connexion à la base de données…</p></div>;
  }
  if (status === 'setup') {
    return <SetupScreen error={error} onSubmit={connect} />;
  }
  return <App onDisconnect={resetConfig} />;
}

  const [restockAmount, setRestockAmount] = useState('');

  const [stockSearch, setStockSearch] = useState('');

  const [showEmployeeForm, setShowEmployeeForm] = useState(false);
  const [employeeForm, setEmployeeForm] = useState({ name: '', role: ROLES[0], pin: '' });
  const [employeeFormError, setEmployeeFormError] = useState('');
  const [confirmDeleteEmployee, setConfirmDeleteEmployee] = useState(null);

  // Rapports
  const [reportPeriod, setReportPeriod] = useState('today');
  const [voidDraftId, setVoidDraftId] = useState(null);
  const [voidReason, setVoidReason] = useState('');
  const [exportLoading, setExportLoading] = useState(false);

  // Sécurité
  const [managerPinForm, setManagerPinForm] = useState({ current: '', next: '' });
  const [managerPinFormError, setManagerPinFormError] = useState('');
  const [managerPinFormSuccess, setManagerPinFormSuccess] = useState('');
  const [pinResetEmployeeId, setPinResetEmployeeId] = useState('');
  const [pinResetValue, setPinResetValue] = useState('');
  const [pinResetMessage, setPinResetMessage] = useState('');

  // ---------- SYNCHRONISATION TEMPS RÉEL (Firestore) ----------
  useEffect(() => {
    const db = firebase.firestore();

    const unsubProducts = db.collection(META_COL).doc('products').onSnapshot(snap => {
      if (snap.exists) setProducts(snap.data().items || []);
      else db.collection(META_COL).doc('products').set({ items: SEED_PRODUCTS });
      setMetaLoaded(m => ({ ...m, products: true }));
    }, err => console.error('products', err));

    const unsubEmployees = db.collection(META_COL).doc('employees').onSnapshot(snap => {
      if (snap.exists) {
        const list = (snap.data().items || []).map(e => e.pin ? e : { ...e, pin: '0000' });
        setEmployees(list);
      } else {
        db.collection(META_COL).doc('employees').set({ items: SEED_EMPLOYEES });
      }
      setMetaLoaded(m => ({ ...m, employees: true }));
    }, err => console.error('employees', err));

    const unsubSettings = db.collection(META_COL).doc('settings').onSnapshot(snap => {
      if (snap.exists) setSettings(snap.data());
      else db.collection(META_COL).doc('settings').set(DEFAULT_SETTINGS);
      setMetaLoaded(m => ({ ...m, settings: true }));
    }, err => console.error('settings', err));

    const unsubSales = db.collection(SALES_COL).orderBy('timestamp', 'desc').limit(SALES_LIMIT).onSnapshot(snap => {
      setSales(snap.docs.map(d => d.data()));
      setMetaLoaded(m => ({ ...m, sales: true }));
    }, err => console.error('sales', err));

    return () => { unsubProducts(); unsubEmployees(); unsubSettings(); unsubSales(); };
  }, []);

  function persistProducts(next) {
    setProducts(next);
    firebase.firestore().collection(META_COL).doc('products').set({ items: next }).catch(e => console.error(e));
  }
  function persistEmployees(next) {
    setEmployees(next);
    firebase.firestore().collection(META_COL).doc('employees').set({ items: next }).catch(e => console.error(e));
  }
  function persistSettings(next) {
    setSettings(next);
    firebase.firestore().collection(META_COL).doc('settings').set(next).catch(e => console.error(e));
  }

  // ---------- ACCÈS GÉRANT ----------
  function requestView(target) {
    if (target === 'stock' || target === 'employes' || target === 'rapports') {
      if (managerUnlocked) { setView(target); return; }
      setPendingView(target);
      setManagerPinError('');
      setShowManagerPin(true);
    } else {
      setView(target);
    }
  }
  function confirmManagerPin(pin) {
    if (pin === settings.managerPin) {
      setManagerUnlocked(true);
      sessionStorage.setItem('lecomptoir_manager_unlocked', '1');
      setShowManagerPin(false);
      if (pendingView) { setView(pendingView); setPendingView(null); }
    } else {
      setManagerPinError('Code incorrect. Réessayez.');
    }
  }
  function lockManager() {
    setManagerUnlocked(false);
    sessionStorage.removeItem('lecomptoir_manager_unlocked');
    setView('caisse');
  }

  // ---------- SESSION EMPLOYÉ ----------
  function openEmployeeAuth() { setAuthStep('choose'); setAuthError(''); }
  function chooseCandidate(emp) { setAuthCandidate(emp); setAuthStep('pin'); setAuthError(''); }
  function confirmEmployeePin(pin) {
    if (authCandidate && pin === authCandidate.pin) {
      setActiveEmployee(authCandidate);
      setAuthStep(null); setAuthCandidate(null); setAuthError('');
      setCheckoutError('');
    } else {
      setAuthError('Code incorrect.');
    }
  }
  function closeAuth() { setAuthStep(null); setAuthCandidate(null); setAuthError(''); }

  // ---------- CAISSE ----------
  function addToCart(product) {
    if (product.alert > 0 && product.stock <= 0) return;
    setCart(prev => {
      const existing = prev.find(i => i.productId === product.id);
      if (existing) {
        const maxQty = product.alert > 0 ? product.stock : Infinity;
        if (existing.qty >= maxQty) return prev;
        return prev.map(i => i.productId === product.id ? { ...i, qty: i.qty + 1 } : i);
      }
      return [...prev, { productId: product.id, name: product.name, price: product.price, qty: 1 }];
    });
    setCheckoutError('');
  }
  function changeCartQty(productId, delta) {
    setCart(prev => prev.map(i => {
      if (i.productId !== productId) return i;
      const product = products.find(p => p.id === productId);
      const maxQty = product && product.alert > 0 ? product.stock : Infinity;
      const nextQty = Math.min(maxQty, Math.max(1, i.qty + delta));
      return { ...i, qty: nextQty };
    }));
  }
  function removeFromCart(productId) { setCart(prev => prev.filter(i => i.productId !== productId)); }

  const cartTotal = useMemo(() => cart.reduce((s, i) => s + i.price * i.qty, 0), [cart]);

  const filteredProducts = useMemo(() => {
    return products.filter(p => {
      const catOk = activeCategory === 'Tous' || p.category === activeCategory;
      const searchOk = p.name.toLowerCase().includes(searchTerm.toLowerCase());
      return catOk && searchOk;
    });
  }, [products, activeCategory, searchTerm]);

  function handleCheckout() {
    if (cart.length === 0) { setCheckoutError('Le panier est vide.'); return; }
    if (!activeEmployee) { setCheckoutError("Ouvrez une session employé avant d'encaisser."); return; }
    const sale = {
      id: genId(), timestamp: Date.now(), items: cart.map(i => ({ ...i })), total: cartTotal,
      employeeId: activeEmployee.id, employeeName: activeEmployee.name, paymentMethod,
    };
    const nextProducts = products.map(p => {
      const item = cart.find(c => c.productId === p.id);
      if (item && p.alert > 0) return { ...p, stock: Math.max(0, p.stock - item.qty) };
      return p;
    });
    firebase.firestore().collection(SALES_COL).doc(sale.id).set(sale).catch(e => console.error(e));
    persistProducts(nextProducts);
    setReceipt(sale);
    setCart([]);
    setCheckoutError('');
  }

  // ---------- STOCK ----------
  function openNewProductForm() {
    setEditingProduct(null);
    setProductForm({ name: '', category: CATEGORIES[0], price: '', stock: '', alert: '' });
    setShowProductForm(true);
  }
  function openEditProductForm(p) {
    setEditingProduct(p);
    setProductForm({ name: p.name, category: p.category, price: String(p.price), stock: String(p.stock), alert: String(p.alert) });
    setShowProductForm(true);
  }
  function submitProductForm(e) {
    e.preventDefault();
    if (!productForm.name.trim()) return;
    const payload = {
      name: productForm.name.trim(), category: productForm.category,
      price: Number(productForm.price) || 0, stock: Number(productForm.stock) || 0, alert: Number(productForm.alert) || 0,
    };
    if (editingProduct) persistProducts(products.map(p => p.id === editingProduct.id ? { ...p, ...payload } : p));
    else persistProducts([...products, { id: genId(), ...payload }]);
    setShowProductForm(false);
  }
  function deleteProduct(id) { persistProducts(products.filter(p => p.id !== id)); setConfirmDeleteProduct(null); }
  function submitRestock(id) {
    const amount = Number(restockAmount);
    if (!amount || amount <= 0) return;
    persistProducts(products.map(p => p.id === id ? { ...p, stock: p.stock + amount } : p));
    setRestockId(null); setRestockAmount('');
  }

  const visibleStockProducts = useMemo(() => products.filter(p => p.name.toLowerCase().includes(stockSearch.toLowerCase())), [products, stockSearch]);

  // ---------- EMPLOYÉS ----------
  function submitEmployeeForm(e) {
    e.preventDefault();
    if (!employeeForm.name.trim()) return;
    if (!/^\d{4}$/.test(employeeForm.pin)) { setEmployeeFormError('Le code PIN doit contenir exactement 4 chiffres.'); return; }
    persistEmployees([...employees, { id: genId(), name: employeeForm.name.trim(), role: employeeForm.role, pin: employeeForm.pin }]);
    setEmployeeForm({ name: '', role: ROLES[0], pin: '' });
    setEmployeeFormError('');
    setShowEmployeeForm(false);
  }
  function deleteEmployee(id) {
    persistEmployees(employees.filter(e => e.id !== id));
    setConfirmDeleteEmployee(null);
    if (activeEmployee && activeEmployee.id === id) setActiveEmployee(null);
  }
  function employeeStats(employeeId) {
    const empSales = sales.filter(s => s.employeeId === employeeId);
    const validSales = empSales.filter(s => !s.voided);
    return { count: validSales.length, revenue: validSales.reduce((s, sale) => s + sale.total, 0), voidedCount: empSales.length - validSales.length };
  }

  // ---------- SÉCURITÉ ----------
  function submitChangeManagerPin(e) {
    e.preventDefault();
    setManagerPinFormSuccess('');
    if (managerPinForm.current !== settings.managerPin) { setManagerPinFormError('Code actuel incorrect.'); return; }
    if (!/^\d{4}$/.test(managerPinForm.next)) { setManagerPinFormError('Le nouveau code doit contenir 4 chiffres.'); return; }
    persistSettings({ ...settings, managerPin: managerPinForm.next });
    setManagerPinForm({ current: '', next: '' });
    setManagerPinFormError('');
    setManagerPinFormSuccess('Code gérant mis à jour sur tous les appareils.');
  }
  function handleResetEmployeePin() {
    setPinResetMessage('');
    if (!pinResetEmployeeId) { setPinResetMessage('Choisissez un employé.'); return; }
    if (!/^\d{4}$/.test(pinResetValue)) { setPinResetMessage('Le code doit contenir 4 chiffres.'); return; }
    persistEmployees(employees.map(e => e.id === pinResetEmployeeId ? { ...e, pin: pinResetValue } : e));
    setPinResetMessage('Code mis à jour pour ' + (employees.find(e => e.id === pinResetEmployeeId)?.name || ''));
    setPinResetValue('');
  }

  // ---------- RAPPORTS ----------
  const filteredSales = useMemo(() => {
    const now = Date.now();
    if (reportPeriod === 'today') return sales.filter(s => isSameDay(s.timestamp, now));
    if (reportPeriod === 'week') return sales.filter(s => now - s.timestamp <= 7 * 24 * 3600 * 1000);
    return sales;
  }, [sales, reportPeriod]);

  const reportStats = useMemo(() => {
    const valid = filteredSales.filter(s => !s.voided);
    const revenue = valid.reduce((s, sale) => s + sale.total, 0);
    const count = valid.length;
    return { revenue, count, avgBasket: count ? revenue / count : 0 };
  }, [filteredSales]);

  const dailyChartData = useMemo(() => {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = Date.now() - i * 24 * 3600 * 1000;
      const total = sales.filter(s => isSameDay(s.timestamp, d) && !s.voided).reduce((sum, s) => sum + s.total, 0);
      days.push({ day: formatDay(d), total });
    }
    return days;
  }, [sales]);

  const topProducts = useMemo(() => {
    const map = {};
    filteredSales.filter(s => !s.voided).forEach(sale => sale.items.forEach(item => {
      if (!map[item.name]) map[item.name] = { name: item.name, qty: 0, revenue: 0 };
      map[item.name].qty += item.qty;
      map[item.name].revenue += item.qty * item.price;
    }));
    return Object.values(map).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
  }, [filteredSales]);

  const paymentBreakdown = useMemo(() => PAYMENT_METHODS.map(pm => {
    const relevant = filteredSales.filter(s => s.paymentMethod === pm.id && !s.voided);
    return { ...pm, total: relevant.reduce((s, sale) => s + sale.total, 0), count: relevant.length };
  }), [filteredSales]);

  const maxPaymentTotal = Math.max(1, ...paymentBreakdown.map(p => p.total));
  const maxChartTotal = Math.max(1, ...dailyChartData.map(d => d.total));

  function requestVoid(id) { setVoidDraftId(id); setVoidReason(''); }
  function confirmVoid(id) {
    if (!voidReason.trim()) return;
    firebase.firestore().collection(SALES_COL).doc(id).update({ voided: true, voidReason: voidReason.trim(), voidedAt: Date.now() }).catch(e => console.error(e));
    setVoidDraftId(null); setVoidReason('');
  }

  async function exportExcel() {
    if (typeof XLSX === 'undefined') { alert("Le module d'export n'a pas pu se charger. Vérifiez votre connexion internet."); return; }
    setExportLoading(true);
    try {
      const snap = await firebase.firestore().collection(SALES_COL).orderBy('timestamp', 'desc').get();
      const allSales = snap.docs.map(d => d.data());
      const wb = XLSX.utils.book_new();

      const ventesRows = allSales.map(s => ({
        'ID': s.id, 'Date': formatDateTime(s.timestamp), 'Employé': s.employeeName,
        'Nb articles': s.items.reduce((n, i) => n + i.qty, 0), 'Total (FCFA)': s.total,
        'Paiement': PAYMENT_METHODS.find(pm => pm.id === s.paymentMethod)?.label || s.paymentMethod,
        'Statut': s.voided ? 'Annulée' : 'Validée', 'Motif annulation': s.voidReason || '',
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ventesRows), 'Ventes');

      const detailRows = [];
      allSales.forEach(s => s.items.forEach(item => {
        detailRows.push({
          'Date': formatDateTime(s.timestamp), 'ID Vente': s.id, 'Employé': s.employeeName, 'Article': item.name,
          'Quantité': item.qty, 'Prix unitaire (FCFA)': item.price, 'Sous-total (FCFA)': item.price * item.qty,
          'Statut vente': s.voided ? 'Annulée' : 'Validée',
        });
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detailRows), 'Détail articles');

      const stockRows = products.map(p => ({
        'Article': p.name, 'Catégorie': p.category, 'Prix (FCFA)': p.price,
        'Stock actuel': p.alert > 0 ? p.stock : 'Non suivi', 'Seuil alerte': p.alert,
      }));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stockRows), 'Stock');

      const employeeRows = employees.map(e => {
        const empAll = allSales.filter(s => s.employeeId === e.id);
        const empValid = empAll.filter(s => !s.voided);
        return {
          'Nom': e.name, 'Rôle': e.role, 'Ventes validées': empValid.length,
          "Chiffre d'affaires (FCFA)": empValid.reduce((s, sale) => s + sale.total, 0),
          'Ventes annulées': empAll.length - empValid.length,
        };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(employeeRows), 'Employés');

      const dateStr = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `lecomptoir-export-${dateStr}.xlsx`);
    } catch (e) {
      console.error(e);
      alert("Erreur lors de l'export. Vérifiez votre connexion internet.");
    } finally {
      setExportLoading(false);
    }
  }

  const allMetaLoaded = metaLoaded.products && metaLoaded.employees && metaLoaded.settings && metaLoaded.sales;
  if (!allMetaLoaded) {
    return <div className="setup-shell"><p style={{ color: 'var(--text-dim)' }}>Chargement des données…</p></div>;
  }

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="brand">
          <span className="brand-mark"><Icon name="mug" size={18}/></span>
          <span className="brand-name nav-label">Le Comptoir</span>
        </div>
        <nav className="nav">
          <button className={`nav-item ${view === 'caisse' ? 'active' : ''}`} onClick={() => requestView('caisse')}><Icon name="cart" size={20}/><span className="nav-label">Caisse</span></button>
          <button className={`nav-item ${view === 'stock' ? 'active' : ''}`} onClick={() => requestView('stock')}><Icon name="package" size={20}/><span className="nav-label">Stock</span>{!managerUnlocked && <span className="lock-badge"><Icon name="lock" size={12}/></span>}</button>
          <button className={`nav-item ${view === 'employes' ? 'active' : ''}`} onClick={() => requestView('employes')}><Icon name="users" size={20}/><span className="nav-label">Employés</span>{!managerUnlocked && <span className="lock-badge"><Icon name="lock" size={12}/></span>}</button>
          <button className={`nav-item ${view === 'rapports' ? 'active' : ''}`} onClick={() => requestView('rapports')}><Icon name="bar-chart" size={20}/><span className="nav-label">Rapports</span>{!managerUnlocked && <span className="lock-badge"><Icon name="lock" size={12}/></span>}</button>
        </nav>
        {managerUnlocked && (
          <button className="nav-item" style={{ marginTop: 'auto' }} onClick={lockManager}>
            <Icon name="lock" size={18}/><span className="nav-label">Verrouiller</span>
          </button>
        )}
      </aside>

      <main className="content">
        {view === 'caisse' && (
          <div className="caisse-layout">
            <div>
              <div className="topbar">
                <h1 className="page-title">Caisse</h1>
                <div className="search-box"><Icon name="search" size={16}/><input placeholder="Rechercher un article…" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} /></div>
              </div>
              <div className="chip-row">
                <button className={`chip ${activeCategory === 'Tous' ? 'active' : ''}`} onClick={() => setActiveCategory('Tous')}>Tous</button>
                {CATEGORIES.map(c => <button key={c} className={`chip ${activeCategory === c ? 'active' : ''}`} onClick={() => setActiveCategory(c)}>{c}</button>)}
              </div>
              <div className="product-grid">
                {filteredProducts.map(p => {
                  const outOfStock = p.alert > 0 && p.stock <= 0;
                  const lowStock = p.alert > 0 && p.stock > 0 && p.stock <= p.alert;
                  return (
                    <button key={p.id} className={`product-card ${outOfStock ? 'disabled' : ''}`} onClick={() => !outOfStock && addToCart(p)} disabled={outOfStock}>
                      <span className="product-name">{p.name}</span>
                      <span className="product-price">{formatFCFA(p.price)}</span>
                      {outOfStock && <span className="product-flag flag-out">Rupture</span>}
                      {!outOfStock && lowStock && <span className="product-flag flag-low">Stock bas</span>}
                    </button>
                  );
                })}
                {filteredProducts.length === 0 && <p className="empty-hint">Aucun article ne correspond.</p>}
              </div>
            </div>

            <div className="caisse-right">
              <h2 className="panel-title"><Icon name="cart" size={18}/> Commande en cours</h2>
              <div className="cart-list">
                {cart.length === 0 && <p className="empty-hint">Le panier est vide. Touchez un article pour l'ajouter.</p>}
                {cart.map(item => (
                  <div key={item.productId} className="cart-item">
                    <div className="cart-item-info">
                      <span className="cart-item-name">{item.name}</span>
                      <span className="cart-item-price">{formatFCFA(item.price)} x {item.qty}</span>
                    </div>
                    <div className="cart-item-actions">
                      <button className="qty-btn" onClick={() => changeCartQty(item.productId, -1)}><Icon name="minus" size={14}/></button>
                      <span className="qty-value">{item.qty}</span>
                      <button className="qty-btn" onClick={() => changeCartQty(item.productId, 1)}><Icon name="plus" size={14}/></button>
                      <button className="qty-btn remove" onClick={() => removeFromCart(item.productId)}><Icon name="trash" size={14}/></button>
                    </div>
                  </div>
                ))}
              </div>
              <div className="cart-footer">
                <div className="field-group">
                  <label>Employé</label>
                  {activeEmployee ? (
                    <div className="employee-session">
                      <div className="employee-session-info">
                        <span className="employee-session-avatar">{initials(activeEmployee.name)}</span>
                        <div>
                          <div className="employee-session-name">{activeEmployee.name}</div>
                          <div className="employee-session-role">{activeEmployee.role}</div>
                        </div>
                      </div>
                      <button className="btn-ghost" onClick={openEmployeeAuth}>Changer</button>
                    </div>
                  ) : (
                    <button className="btn-primary btn-block" type="button" onClick={openEmployeeAuth}>Ouvrir une session</button>
                  )}
                </div>
                <div className="field-group">
                  <label>Paiement</label>
                  <div className="payment-row">
                    {PAYMENT_METHODS.map(pm => (
                      <button key={pm.id} type="button" className={`payment-btn ${paymentMethod === pm.id ? 'active' : ''}`} onClick={() => setPaymentMethod(pm.id)}>
                        <Icon name={pm.icon} size={16}/> {pm.label}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="cart-total-row"><span>Total</span><span className="cart-total-value">{formatFCFA(cartTotal)}</span></div>
                {checkoutError && <p className="form-error">{checkoutError}</p>}
                <button className="btn-primary btn-block" onClick={handleCheckout}>Encaisser</button>
              </div>
            </div>
          </div>
        )}

        {view === 'stock' && managerUnlocked && (
          <div>
            <div className="topbar">
              <h1 className="page-title">Stock</h1>
              <div className="topbar-actions">
                <div className="search-box"><Icon name="search" size={16}/><input placeholder="Rechercher…" value={stockSearch} onChange={e => setStockSearch(e.target.value)} /></div>
                <button className="btn-primary" onClick={openNewProductForm}><Icon name="plus-circle" size={16}/> Nouvel article</button>
              </div>
            </div>
            <div className="table-wrap">
              <table className="data-table">
                <thead><tr><th>Article</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th></th></tr></thead>
                <tbody>
                  {visibleStockProducts.map(p => {
                    const lowStock = p.alert > 0 && p.stock <= p.alert;
                    return (
                      <tr key={p.id} className={lowStock ? 'row-low-stock' : ''}>
                        <td>{p.name}</td>
                        <td><span className="badge-cat">{p.category}</span></td>
                        <td className="mono">{formatFCFA(p.price)}</td>
                        <td className="mono">{p.alert > 0 ? p.stock : '—'}{lowStock && <Icon name="alert" size={14} style={{ marginLeft: 6, color: 'var(--brick)', verticalAlign: '-2px' }}/>}</td>
                        <td>
                          <div className="row-actions">
                            {restockId === p.id ? (
                              <div className="inline-restock">
                                <input type="number" placeholder="+ Qté" value={restockAmount} onChange={e => setRestockAmount(e.target.value)} autoFocus />
                                <button className="btn-ghost" onClick={() => submitRestock(p.id)}>OK</button>
                                <button className="btn-ghost" onClick={() => { setRestockId(null); setRestockAmount(''); }}><Icon name="x" size={14}/></button>
                              </div>
                            ) : confirmDeleteProduct === p.id ? (
                              <div className="inline-restock">
                                <span className="confirm-text">Supprimer ?</span>
                                <button className="btn-danger" onClick={() => deleteProduct(p.id)}>Oui</button>
                                <button className="btn-ghost" onClick={() => setConfirmDeleteProduct(null)}>Non</button>
                              </div>
                            ) : (
                              <React.Fragment>
                                {p.alert > 0 && <button className="btn-ghost" onClick={() => setRestockId(p.id)}><Icon name="plus" size={14}/> Stock</button>}
                                <button className="btn-ghost" onClick={() => openEditProductForm(p)}><Icon name="edit" size={14}/></button>
                                <button className="btn-ghost danger" onClick={() => setConfirmDeleteProduct(p.id)}><Icon name="trash" size={14}/></button>
                              </React.Fragment>
                            )}
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                  {visibleStockProducts.length === 0 && <tr><td colSpan={5} className="empty-hint">Aucun article trouvé.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {view === 'employes' && managerUnlocked && (
          <div>
            <div className="topbar">
              <h1 className="page-title">Employés</h1>
              <button className="btn-primary" onClick={() => setShowEmployeeForm(s => !s)}><Icon name="plus-circle" size={16}/> Nouvel employé</button>
            </div>
            {showEmployeeForm && (
              <form onSubmit={submitEmployeeForm} className="card employee-form">
                <div className="field-row">
                  <div className="field-group"><label>Nom complet</label><input value={employeeForm.name} onChange={e => setEmployeeForm(f => ({ ...f, name: e.target.value }))} required /></div>
                  <div className="field-group"><label>Rôle</label>
                    <select value={employeeForm.role} onChange={e => setEmployeeForm(f => ({ ...f, role: e.target.value }))}>
                      {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </div>
                  <div className="field-group"><label>Code PIN (4 chiffres)</label>
                    <input type="password" inputMode="numeric" maxLength={4} value={employeeForm.pin} onChange={e => setEmployeeForm(f => ({ ...f, pin: e.target.value.replace(/\D/g, '').slice(0, 4) }))} required />
                  </div>
                </div>
                {employeeFormError && <p className="form-error">{employeeFormError}</p>}
                <button type="submit" className="btn-primary">Ajouter l'employé</button>
              </form>
            )}
            <div className="employee-grid">
              {employees.map(emp => {
                const stats = employeeStats(emp.id);
                return (
                  <div key={emp.id} className="card employee-card">
                    <div className="employee-avatar">{initials(emp.name)}</div>
                    <div className="employee-info"><span className="employee-name">{emp.name}</span><span className="employee-role">{emp.role}</span></div>
                    <div className="employee-stats">
                      <div><span className="stat-value">{stats.count}</span><span className="stat-label">ventes</span></div>
                      <div><span className="stat-value">{formatFCFA(stats.revenue)}</span><span className="stat-label">généré</span></div>
                      {stats.voidedCount > 0 && <div><span className="stat-value warn">{stats.voidedCount}</span><span className="stat-label">annulée(s)</span></div>}
                    </div>
                    {confirmDeleteEmployee === emp.id ? (
                      <div className="inline-restock">
                        <span className="confirm-text">Retirer ?</span>
                        <button className="btn-danger" onClick={() => deleteEmployee(emp.id)}>Oui</button>
                        <button className="btn-ghost" onClick={() => setConfirmDeleteEmployee(null)}>Non</button>
                      </div>
                    ) : (
                      <button className="btn-ghost danger employee-remove" onClick={() => setConfirmDeleteEmployee(emp.id)}><Icon name="trash" size={14}/></button>
                    )}
                  </div>
                );
              })}
              {employees.length === 0 && <p className="empty-hint">Aucun employé enregistré.</p>}
            </div>
          </div>
        )}

        {view === 'rapports' && managerUnlocked && (
          <div>
            <div className="topbar">
              <h1 className="page-title">Rapports</h1>
              <div className="topbar-actions">
                <div className="chip-row" style={{ marginBottom: 0 }}>
                  <button className={`chip ${reportPeriod === 'today' ? 'active' : ''}`} onClick={() => setReportPeriod('today')}>Aujourd'hui</button>
                  <button className={`chip ${reportPeriod === 'week' ? 'active' : ''}`} onClick={() => setReportPeriod('week')}>7 derniers jours</button>
                  <button className={`chip ${reportPeriod === 'all' ? 'active' : ''}`} onClick={() => setReportPeriod('all')}>Tout</button>
                </div>
                <button className="btn-ghost" onClick={exportExcel} disabled={exportLoading}><Icon name="download" size={14}/> {exportLoading ? 'Génération…' : 'Exporter (Excel)'}</button>
              </div>
            </div>
            <p className="form-hint" style={{ marginBottom: 16 }}><Icon name="wifi" size={12} style={{ verticalAlign: '-2px', marginRight: 4 }}/>Données synchronisées en temps réel. Les rapports à l'écran portent sur les {SALES_LIMIT} ventes les plus récentes ; l'export Excel contient l'historique complet.</p>
            <div className="stat-cards">
              <div className="stat-card"><span className="stat-card-label">Chiffre d'affaires</span><span className="stat-card-value">{formatFCFA(reportStats.revenue)}</span></div>
              <div className="stat-card"><span className="stat-card-label">Ventes</span><span className="stat-card-value">{reportStats.count}</span></div>
              <div className="stat-card"><span className="stat-card-label">Panier moyen</span><span className="stat-card-value">{formatFCFA(reportStats.avgBasket)}</span></div>
            </div>
            <div className="report-grid">
              <div className="card">
                <h3 className="card-title"><Icon name="trend" size={16}/> Chiffre d'affaires (7 derniers jours)</h3>
                <div className="mini-chart">
                  {dailyChartData.map(d => (
                    <div key={d.day} className="mini-chart-col">
                      <div className="mini-chart-bar" title={formatFCFA(d.total)} style={{ height: `${Math.max(2, (d.total / maxChartTotal) * 160)}px` }}></div>
                      <span className="mini-chart-label">{d.day}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="card">
                <h3 className="card-title">Produits les plus vendus</h3>
                <div className="top-products-list">
                  {topProducts.length === 0 && <p className="empty-hint">Aucune vente sur la période.</p>}
                  {topProducts.map((tp, idx) => (
                    <div key={tp.name} className="top-product-row">
                      <span className="top-product-rank">{idx + 1}</span>
                      <div className="top-product-info"><span className="top-product-name">{tp.name}</span><span className="top-product-qty">{tp.qty} vendu(s)</span></div>
                      <span className="top-product-revenue mono">{formatFCFA(tp.revenue)}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="card">
                <h3 className="card-title">Répartition des paiements</h3>
                <div className="payment-breakdown">
                  {paymentBreakdown.map(pm => {
                    const pct = Math.round((pm.total / maxPaymentTotal) * 100);
                    return (
                      <div key={pm.id} className="payment-bar-row">
                        <div className="payment-bar-label"><Icon name={pm.icon} size={14}/> {pm.label}</div>
                        <div className="payment-bar-track"><div className="payment-bar-fill" style={{ width: `${pct}%` }}></div></div>
                        <span className="mono payment-bar-value">{formatFCFA(pm.total)}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
              <div className="card">
                <h3 className="card-title"><Icon name="shield" size={16}/> Sécurité & accès</h3>
                <div className="security-block">
                  <h4>Code gérant</h4>
                  <form onSubmit={submitChangeManagerPin} className="security-form">
                    <input type="password" inputMode="numeric" maxLength={4} placeholder="Code actuel" value={managerPinForm.current} onChange={e => setManagerPinForm(f => ({ ...f, current: e.target.value.replace(/\D/g, '').slice(0, 4) }))} />
                    <input type="password" inputMode="numeric" maxLength={4} placeholder="Nouveau code" value={managerPinForm.next} onChange={e => setManagerPinForm(f => ({ ...f, next: e.target.value.replace(/\D/g, '').slice(0, 4) }))} />
                    <button className="btn-ghost" type="submit">Mettre à jour</button>
                  </form>
                  {managerPinFormError && <p className="form-error">{managerPinFormError}</p>}
                  {managerPinFormSuccess && <p className="form-success">{managerPinFormSuccess}</p>}
                </div>
                <div className="security-block">
                  <h4>Code employé</h4>
                  <div className="security-form">
                    <select value={pinResetEmployeeId} onChange={e => setPinResetEmployeeId(e.target.value)}>
                      <option value="">Choisir un employé…</option>
                      {employees.map(e => <option key={e.id} value={e.id}>{e.name}</option>)}
                    </select>
                    <input type="password" inputMode="numeric" maxLength={4} placeholder="Nouveau code" value={pinResetValue} onChange={e => setPinResetValue(e.target.value.replace(/\D/g, '').slice(0, 4))} />
                    <button className="btn-ghost" onClick={handleResetEmployeePin}>Réinitialiser</button>
                  </div>
                  {pinResetMessage && <p className="form-hint" style={{ marginTop: 6 }}>{pinResetMessage}</p>}
                </div>
                <div className="security-block">
                  <h4>Cet appareil</h4>
                  <button className="btn-ghost" onClick={onDisconnect}>Changer la configuration Firebase</button>
                </div>
              </div>
              <div className="card span-2">
                <h3 className="card-title">Ventes récentes {reportPeriod !== 'all' ? '(période sélectionnée)' : ''}</h3>
                <div className="table-wrap" style={{ border: 'none' }}>
                  <table className="data-table">
                    <thead><tr><th>Heure</th><th>Employé</th><th>Articles</th><th>Total</th><th>Paiement</th><th>Statut</th><th></th></tr></thead>
                    <tbody>
                      {filteredSales.slice(0, 30).map(s => (
                        <tr key={s.id} className={s.voided ? 'row-voided' : ''}>
                          <td className="mono">{formatDateTime(s.timestamp)}</td>
                          <td>{s.employeeName}</td>
                          <td>{s.items.reduce((n, i) => n + i.qty, 0)}</td>
                          <td className="mono">{formatFCFA(s.total)}</td>
                          <td>{PAYMENT_METHODS.find(pm => pm.id === s.paymentMethod)?.label}</td>
                          <td>{s.voided ? <span className="badge-voided">Annulée</span> : <span className="badge-ok">Validée</span>}</td>
                          <td>
                            {!s.voided && (
                              voidDraftId === s.id ? (
                                <div className="inline-restock">
                                  <input placeholder="Motif" value={voidReason} onChange={e => setVoidReason(e.target.value)} autoFocus />
                                  <button className="btn-danger" onClick={() => confirmVoid(s.id)}>OK</button>
                                  <button className="btn-ghost" onClick={() => setVoidDraftId(null)}><Icon name="x" size={14}/></button>
                                </div>
                              ) : (
                                <button className="btn-ghost danger" onClick={() => requestVoid(s.id)}>Annuler</button>
                              )
                            )}
                            {s.voided && <span className="void-reason" title={s.voidReason}>{s.voidReason}</span>}
                          </td>
                        </tr>
                      ))}
                      {filteredSales.length === 0 && <tr><td colSpan={7} className="empty-hint">Aucune vente.</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        )}
      </main>

      {showManagerPin && (
        <PinPad
          title="Accès gérant"
          subtitle="Cet espace est réservé au gérant ou au propriétaire."
          error={managerPinError}
          onSubmit={confirmManagerPin}
          onCancel={() => { setShowManagerPin(false); setPendingView(null); }}
        />
      )}

      {authStep === 'choose' && (
        <div className="modal-overlay" onClick={closeAuth}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header"><h3>Qui êtes-vous ?</h3><button className="btn-ghost" onClick={closeAuth}><Icon name="x" size={16}/></button></div>
            <div className="employee-choose-list">
              {employees.map(emp => (
                <button key={emp.id} className="employee-choose-item" onClick={() => chooseCandidate(emp)}>
                  <span className="employee-session-avatar">{initials(emp.name)}</span>
                  <span>{emp.name}<small>{emp.role}</small></span>
                </button>
              ))}
              {employees.length === 0 && <p className="empty-hint">Aucun employé enregistré. Ajoutez-en un dans l'espace gérant.</p>}
            </div>
          </div>
        </div>
      )}
      {authStep === 'pin' && authCandidate && (
        <PinPad
          title={`Code de ${authCandidate.name}`}
          subtitle="Entrez votre code personnel à 4 chiffres."
          error={authError}
          onSubmit={confirmEmployeePin}
          onCancel={closeAuth}
        />
      )}

      {showProductForm && (
        <div className="modal-overlay" onClick={() => setShowProductForm(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header"><h3>{editingProduct ? "Modifier l'article" : 'Nouvel article'}</h3><button className="btn-ghost" onClick={() => setShowProductForm(false)}><Icon name="x" size={16}/></button></div>
            <form onSubmit={submitProductForm} className="modal-form">
              <div className="field-group"><label>Nom</label><input value={productForm.name} onChange={e => setProductForm(f => ({ ...f, name: e.target.value }))} required /></div>
              <div className="field-group"><label>Catégorie</label>
                <select value={productForm.category} onChange={e => setProductForm(f => ({ ...f, category: e.target.value }))}>
                  {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div className="field-row">
                <div className="field-group"><label>Prix (FCFA)</label><input type="number" min="0" value={productForm.price} onChange={e => setProductForm(f => ({ ...f, price: e.target.value }))} required /></div>
                <div className="field-group"><label>Stock initial</label><input type="number" min="0" value={productForm.stock} onChange={e => setProductForm(f => ({ ...f, stock: e.target.value }))} /></div>
                <div className="field-group"><label>Seuil d'alerte</label><input type="number" min="0" value={productForm.alert} onChange={e => setProductForm(f => ({ ...f, alert: e.target.value }))} /></div>
              </div>
              <p className="form-hint">Seuil d'alerte à 0 = article non suivi en stock (ex : cocktail préparé à la demande).</p>
              <button type="submit" className="btn-primary btn-block">{editingProduct ? 'Enregistrer' : 'Ajouter'}</button>
            </form>
          </div>
        </div>
      )}

      {receipt && (
        <div className="modal-overlay" onClick={() => setReceipt(null)}>
          <div className="receipt" onClick={e => e.stopPropagation()}>
            <div className="receipt-perforation"></div>
            <div className="receipt-body">
              <div className="receipt-head"><Icon name="receipt" size={20}/><span>FACTURE</span></div>
              <p className="receipt-sub">{formatDateTime(receipt.timestamp)}</p>
              <p className="receipt-sub">Servi par {receipt.employeeName}</p>
              <div className="receipt-divider"></div>
              <div className="receipt-items">
                {receipt.items.map((item, idx) => (
                  <div key={idx} className="receipt-item"><span>{item.qty} x {item.name}</span><span>{formatFCFA(item.price * item.qty)}</span></div>
                ))}
              </div>
              <div className="receipt-divider"></div>
              <div className="receipt-total"><span>TOTAL</span><span>{formatFCFA(receipt.total)}</span></div>
              <p className="receipt-sub" style={{ textTransform: 'capitalize' }}>{PAYMENT_METHODS.find(pm => pm.id === receipt.paymentMethod)?.label}</p>
              <p className="receipt-thanks">Merci de votre visite !</p>
            </div>
            <div className="receipt-perforation"></div>
            <div className="receipt-actions">
              <button className="btn-ghost" onClick={() => window.print()}><Icon name="printer" size={14}/> Imprimer</button>
              <button className="btn-primary" onClick={() => setReceipt(null)}>Nouvelle vente <Icon name="chevron-right" size={16}/></button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>
</body>
</html>
